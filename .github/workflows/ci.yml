name: CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install project and optional test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[audio,visual]"

      - name: Run unit and FFmpeg integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate CLI entry point
        run: shortform-editor --help

      - name: Validate bundled JSON schema
        run: python -c "import json; from pathlib import Path; json.loads(Path('schemas/edit-decision-list.schema.json').read_text(encoding='utf-8')); print('EDL schema JSON is valid')"
