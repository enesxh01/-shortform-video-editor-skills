name: Runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Compile runtime
        run: python -m py_compile shortform_editor/cli.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Installer smoke test
        run: |
          bash scripts/install.sh "$RUNNER_TEMP/opencode-skills"
          test -f "$RUNNER_TEMP/opencode-skills/shortform-video-editor/runtime/cli.py"
          test -f "$RUNNER_TEMP/opencode-skills/references/viral-scoring.md"
          test -f "$RUNNER_TEMP/opencode-skills/schemas/edit-decision-list.schema.json"
          test -f "$RUNNER_TEMP/opencode-skills/shortform-video-editor/examples/edit-decision-list.example.json"

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCode skills
        shell: pwsh
        run: |
          .\scripts\install.ps1 "$env:RUNNER_TEMP\opencode-skills"
          if (!(Test-Path "$env:RUNNER_TEMP\opencode-skills\shortform-video-editor\runtime\cli.py")) { throw "Runtime was not installed" }
          if (!(Test-Path "$env:RUNNER_TEMP\opencode-skills\references\viral-scoring.md")) { throw "Shared references were not installed" }
          if (!(Test-Path "$env:RUNNER_TEMP\opencode-skills\schemas\edit-decision-list.schema.json")) { throw "EDL schema was not installed" }
          if (!(Test-Path "$env:RUNNER_TEMP\opencode-skills\shortform-video-editor\examples\edit-decision-list.example.json")) { throw "Example EDL was not installed" }
