name: Runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile runtime
        run: python -m py_compile shortform_editor/cli.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
